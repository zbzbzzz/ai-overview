<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>历史周榜 · GitHub AI 周榜日快照</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>

:root {
  --snow: #FFFFFF;
  --frost: #F2F7FB;
  --mist: #E3EEF7;
  --navy: #0A2F5C;
  --sky: #1F6BB5;
  --ink: #243447;
  --mute: #5B6F84;
  --rule: #C9DBEC;
  --delta: #0D6E9F;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { color-scheme: light; }
body {
  background:
    linear-gradient(180deg, var(--frost) 0, var(--frost) 11.5rem, var(--snow) 11.5rem);
  color: var(--ink);
  font-family: "IBM Plex Sans", "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif;
  font-size: 1rem;
  line-height: 1.6;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
a {
  color: var(--navy);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.16em;
}
a:hover { color: var(--sky); }
a:focus-visible {
  outline: 2px solid var(--sky);
  outline-offset: 3px;
  border-radius: 2px;
}
.page {
  width: min(42rem, calc(100% - 2rem));
  margin: 0 auto;
  padding: 2rem 0 4rem;
}
.mast {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 0.85rem 1.25rem;
  align-items: start;
  padding-bottom: 1.5rem;
  border-bottom: 2px solid var(--navy);
  margin-bottom: 0.25rem;
}
.cal {
  font-family: "Newsreader", "Noto Serif SC", Georgia, serif;
  color: var(--navy);
  line-height: 1;
  text-align: center;
  min-width: 4.5rem;
  padding: 0.35rem 0.5rem 0.55rem;
  background: var(--snow);
  border: 1.5px solid var(--navy);
  border-radius: 3px;
}
.cal .dow {
  display: block;
  font-family: "IBM Plex Sans", sans-serif;
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  color: var(--sky);
  margin-bottom: 0.2rem;
}
.cal .day {
  display: block;
  font-size: 2.35rem;
  font-weight: 600;
  font-variation-settings: "opsz" 60;
}
.cal .ym {
  display: block;
  margin-top: 0.15rem;
  font-size: 0.72rem;
  font-weight: 500;
  color: var(--mute);
  font-family: "IBM Plex Sans", sans-serif;
}
.mast-copy { padding-top: 0.15rem; }
.kicker {
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--sky);
  margin-bottom: 0.35rem;
}
h1 {
  font-family: "Newsreader", "Noto Serif SC", Georgia, serif;
  font-weight: 600;
  font-size: clamp(1.55rem, 4.2vw, 2rem);
  line-height: 1.2;
  color: var(--navy);
  max-width: 14em;
}
.lede {
  margin-top: 0.55rem;
  color: var(--mute);
  font-size: 0.9rem;
  max-width: 34em;
}
.nav {
  display: flex;
  flex-wrap: wrap;
  gap: 0.65rem 1.1rem;
  margin-top: 0.95rem;
  font-size: 0.875rem;
  font-weight: 600;
}
.nav a {
  text-decoration: none;
  border-bottom: 1.5px solid var(--mist);
  padding-bottom: 0.05rem;
}
.nav a:hover { border-bottom-color: var(--sky); }

.board {
  list-style: none;
  margin-top: 0.5rem;
}
.row {
  display: grid;
  grid-template-columns: 2.6rem minmax(0, 1fr);
  column-gap: 0.85rem;
  padding: 1.2rem 0;
  border-bottom: 1px solid var(--rule);
}
.row:last-child { border-bottom: none; }
.rank {
  font-family: "Newsreader", Georgia, serif;
  font-weight: 600;
  font-size: 1.55rem;
  line-height: 1.1;
  color: var(--sky);
  padding-top: 0.12rem;
  font-variant-numeric: tabular-nums;
}
.body { min-width: 0; }
.name {
  font-size: 1.05rem;
  font-weight: 600;
  color: var(--navy);
  text-decoration: none;
  word-break: break-word;
}
.name:hover { color: var(--sky); text-decoration: underline; text-underline-offset: 0.16em; }
.stats {
  display: grid;
  grid-template-columns: repeat(3, max-content);
  gap: 0.55rem 1.15rem;
  margin-top: 0.45rem;
  font-size: 0.78rem;
  color: var(--mute);
}
.stat {
  display: flex;
  flex-direction: column;
  gap: 0.08rem;
}
.stat .lbl {
  font-size: 0.68rem;
  font-weight: 500;
  color: var(--mute);
  opacity: 0.9;
}
.stat .val {
  font-weight: 600;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.stat.lang .val {
  color: var(--navy);
  background: var(--frost);
  border: 1px solid var(--mist);
  border-radius: 2px;
  padding: 0.05rem 0.35rem;
  width: fit-content;
  font-size: 0.75rem;
}
.stat.week .val { color: var(--delta); }
.intro {
  margin-top: 0.55rem;
  font-size: 0.92rem;
  color: var(--ink);
  max-width: 38em;
  line-height: 1.55;
}
.foot {
  margin-top: 2.25rem;
  padding-top: 1.1rem;
  border-top: 1px solid var(--rule);
  font-size: 0.8125rem;
  color: var(--mute);
}
.foot a { font-weight: 600; }

@media (max-width: 420px) {
  .mast { grid-template-columns: 1fr; }
  .cal { width: fit-content; }
  .stats { grid-template-columns: repeat(3, 1fr); gap: 0.45rem 0.5rem; }
}

@keyframes rise {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: none; }
}
@media (prefers-reduced-motion: no-preference) {
  .mast { animation: rise 0.45s ease-out both; }
}
@media (prefers-reduced-motion: reduce) {
  .mast { animation: none; }
}


.month-block {
  margin-top: 1.5rem;
  padding: 1.15rem 1.2rem 1.25rem;
  background: var(--frost);
  border: 1px solid var(--mist);
  border-left: 3px solid var(--navy);
  border-radius: 0 3px 3px 0;
}
.month-block h2 {
  font-family: "Newsreader", "Noto Serif SC", Georgia, serif;
  font-size: 1.2rem;
  font-weight: 600;
  color: var(--navy);
  margin-bottom: 0.75rem;
}
.month-block ul { list-style: none; display: flex; flex-direction: column; gap: 0.5rem; }
.month-block li {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 0.35rem 0.65rem;
}
.month-block li a {
  font-weight: 600;
  font-size: 0.95rem;
  text-decoration: none;
  border-bottom: 1.5px solid var(--mist);
}
.month-block li a:hover { border-bottom-color: var(--sky); }
.day-note { font-size: 0.8rem; color: var(--mute); font-weight: 500; }
code {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 0.85em;
  background: var(--snow);
  border: 1px solid var(--mist);
  padding: 0.05rem 0.3rem;
  border-radius: 2px;
}

  </style>
</head>
<body>
  <div class="page">
    <header class="mast" style="grid-template-columns:1fr">
      <div class="mast-copy">
        <p class="kicker">按月浏览</p>
        <h1>历史周榜</h1>
        <p class="lede">每天的 AI 周榜日快照按自然月归档。点日期打开当天页面。</p>
        <nav class="nav" aria-label="站点导航">
          <a href="index.html">回最新页</a>
          <a href="https://github.com/trending?since=weekly" rel="noopener noreferrer">GitHub Trending</a>
        </nav>
      </div>
    </header>

    <section class="month-block" aria-labelledby="m-2026-10">
      <h2 id="m-2026-10">2026 年 10 月</h2>
      <ul>
        <li>
          <a href="archive/2026-10/github-trending-weekly-2026-10-09.html">2026-10-09</a>
          <span class="day-note">周四 · AI 周榜日快照</span>
        </li>
      </ul>
    </section>

    <footer class="foot">
      <p>新快照会自动出现在对应月份下。路径：<code>archive/YYYY-MM/</code>。</p>
    </footer>
  </div>
</body>
</html>
