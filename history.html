<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>往期速览 · 本周 AI 速览</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet" />
  <style>

:root {
  --snow: #FFFFFF;
  --ice: #EAF3FB;
  --mist: #C8DCEF;
  --navy: #0A3558;
  --sky: #1A7AB8;
  --aqua: #3B9BD4;
  --ink: #1E3348;
  --mute: #5A7085;
  --soft: #F5F9FC;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { color-scheme: light; }
body {
  background: var(--snow);
  background-image:
    radial-gradient(ellipse 80% 40% at 10% -10%, #D9ECF8 0%, transparent 55%),
    radial-gradient(ellipse 60% 30% at 100% 0%, #EAF3FB 0%, transparent 50%);
  background-attachment: fixed;
  color: var(--ink);
  font-family: "Manrope", "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif;
  font-size: 1rem;
  line-height: 1.6;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--navy); text-decoration-thickness: 1px; text-underline-offset: 0.16em; }
a:hover { color: var(--sky); }
a:focus-visible {
  outline: 2px solid var(--sky);
  outline-offset: 3px;
  border-radius: 4px;
}
.wrap {
  width: min(44rem, calc(100% - 1.75rem));
  margin: 0 auto;
  padding: 1.75rem 0 3.5rem;
}
.hero {
  display: flex;
  flex-direction: column;
  gap: 1.15rem;
  margin-bottom: 1.35rem;
}
.hero-top {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 0.75rem 1.25rem;
}
.badge-date {
  display: inline-flex;
  align-items: baseline;
  gap: 0.45rem;
  padding: 0.35rem 0.7rem;
  background: var(--ice);
  border: 1px solid var(--mist);
  border-radius: 999px;
  color: var(--navy);
  font-size: 0.8125rem;
  font-weight: 600;
}
.badge-date .dot {
  width: 0.45rem; height: 0.45rem;
  border-radius: 50%;
  background: var(--aqua);
  display: inline-block;
}
h1 {
  font-family: "Source Serif 4", "Noto Serif SC", Georgia, serif;
  font-weight: 600;
  font-size: clamp(1.65rem, 4.5vw, 2.15rem);
  line-height: 1.2;
  color: var(--navy);
  letter-spacing: -0.02em;
}
.nav {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem 0.85rem;
  font-size: 0.875rem;
  font-weight: 650;
}
.nav a {
  text-decoration: none;
  padding: 0.35rem 0.75rem;
  background: var(--snow);
  border: 1px solid var(--mist);
  border-radius: 999px;
  color: var(--navy);
}
.nav a:hover { background: var(--ice); border-color: var(--aqua); }


.repo-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  margin: 0.85rem 0 0.15rem;
}
.repo-tab {
  appearance: none;
  border: 1px solid var(--mist);
  background: var(--snow);
  color: var(--navy);
  font: inherit;
  font-size: 0.8125rem;
  font-weight: 700;
  padding: 0.38rem 0.78rem;
  border-radius: 999px;
  cursor: pointer;
  line-height: 1.2;
}
.repo-tab:hover { background: var(--ice); border-color: var(--aqua); }
.repo-tab[aria-selected="true"] {
  background: var(--navy);
  border-color: var(--navy);
  color: #fff;
}
.repo-tab .cnt {
  font-weight: 650;
  opacity: 0.75;
  margin-left: 0.2rem;
}
.repo-panel[hidden] { display: none !important; }
.repo-panel .cards { margin-top: 0.85rem; }
.repo-empty {
  margin-top: 0.85rem;
  padding: 1rem 1.1rem;
  background: var(--ice);
  border: 1px dashed var(--mist);
  border-radius: 12px;
  color: var(--mute);
  font-size: 0.9rem;
}

.cards {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 1rem;
  margin-top: 1.15rem;
}
.card {
  background: var(--ice);
  border: 1px solid var(--mist);
  border-radius: 16px;
  padding: 1.15rem 1.2rem 1.2rem;
  position: relative;
}
.card::before {
  content: "";
  position: absolute;
  left: 0; top: 1rem; bottom: 1rem;
  width: 3px;
  background: var(--navy);
  border-radius: 0 2px 2px 0;
}
.card-head {
  display: flex;
  align-items: flex-start;
  gap: 0.85rem;
  padding-left: 0.35rem;
}
.rank {
  flex: 0 0 auto;
  width: 2.55rem;
  height: 2.55rem;
  display: grid;
  place-items: center;
  background: var(--snow);
  border: 1.5px solid var(--navy);
  border-radius: 10px;
  font-family: "Source Serif 4", Georgia, serif;
  font-weight: 650;
  font-size: 1.05rem;
  color: var(--navy);
  font-variant-numeric: tabular-nums;
}
.card-title { min-width: 0; flex: 1; }
.name {
  font-size: 1.12rem;
  font-weight: 700;
  color: var(--navy);
  text-decoration: none;
  word-break: break-word;
  letter-spacing: -0.01em;
}
.name:hover { color: var(--sky); text-decoration: underline; }
.meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.45rem 0.75rem;
  margin-top: 0.4rem;
}
.lang {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  font-size: 0.78rem;
  font-weight: 650;
  color: var(--navy);
  background: var(--snow);
  border: 1px solid var(--mist);
  border-radius: 999px;
  padding: 0.15rem 0.55rem 0.15rem 0.4rem;
}
.lang i {
  width: 0.55rem; height: 0.55rem;
  border-radius: 50%;
  display: inline-block;
}
.pill {
  font-size: 0.75rem;
  font-weight: 650;
  color: var(--mute);
  font-variant-numeric: tabular-nums;
}
.pill strong { color: var(--ink); font-weight: 700; }
.pill.week strong { color: var(--sky); }
.purpose {
  margin: 0.95rem 0 0;
  padding: 0.75rem 0.85rem;
  background: var(--snow);
  border: 1px dashed var(--mist);
  border-radius: 12px;
}
.purpose-label {
  display: flex;
  align-items: center;
  gap: 0.45rem;
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--sky);
  margin-bottom: 0.55rem;
}
.purpose-label .tag {
  background: #DFF0FA;
  color: var(--navy);
  border: 1px solid var(--mist);
  border-radius: 6px;
  padding: 0.12rem 0.45rem;
  font-size: 0.75rem;
}
.flow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.35rem;
}
.flow .step {
  background: var(--ice);
  border: 1px solid var(--mist);
  color: var(--navy);
  font-size: 0.75rem;
  font-weight: 650;
  padding: 0.28rem 0.55rem;
  border-radius: 8px;
}
.flow .arrow {
  color: var(--aqua);
  font-weight: 700;
  font-size: 0.85rem;
  line-height: 1;
}
.diagram {
  margin-top: 0.15rem;
  width: 100%;
  overflow-x: auto;
}
.intro {
  margin-top: 0.7rem;
  font-size: 0.9rem;
  color: var(--ink);
  line-height: 1.5;
  max-width: 40em;
  padding-left: 0.35rem;
}
.news-note {
  margin-top: 0.55rem;
  padding-left: 1.05rem;
  font-size: 0.84rem;
  color: var(--ink);
  line-height: 1.55;
}
.news-note li { margin: 0.2rem 0; }
.news-note li::marker { color: var(--sky); }
.bar-block {
  margin-top: 0.9rem;
  padding-left: 0.35rem;
}
.bar-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 0.35rem;
  font-size: 0.72rem;
  font-weight: 650;
  color: var(--mute);
}
.bar-head .v { color: var(--sky); font-variant-numeric: tabular-nums; }
.bar-track {
  height: 0.65rem;
  background: #D6E7F5;
  border: 1px solid var(--mist);
  border-radius: 999px;
  overflow: hidden;
}
.bar-fill {
  height: 100%;
  background: linear-gradient(90deg, #7BC0E6, #1A7AB8);
  border-radius: 999px;
}
.foot {
  margin-top: 1.75rem;
  padding-top: 1rem;
  border-top: 1px solid var(--mist);
  font-size: 0.8125rem;
  color: var(--mute);
}
.foot a { font-weight: 700; }
@media (max-width: 520px) {
  .card { padding: 1rem; }
}
@media (prefers-reduced-motion: no-preference) {
  .card { transition: border-color 0.15s ease, background 0.15s ease; }
  .card:hover { border-color: var(--aqua); background: #E3F0FA; }
}

.section {
  margin-top: 0.35rem;
  margin-bottom: 1.5rem;
}
.section-head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: 0.4rem 1rem;
  margin-bottom: 0.75rem;
}
.section-head h2 {
  font-family: "Source Serif 4", "Noto Serif SC", Georgia, serif;
  font-weight: 600;
  font-size: 1.2rem;
  color: var(--navy);
  letter-spacing: -0.01em;
}
.section-meta {
  font-size: 0.75rem;
  color: var(--mute);
  font-weight: 600;
}
.news-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 0.65rem;
}
.news-card {
  background: var(--snow);
  border: 1px solid var(--mist);
  border-radius: 14px;
  padding: 0.85rem 1rem;
}
.news-card-head {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  gap: 0.4rem 0.55rem;
}
.news-card a.title {
  font-weight: 700;
  font-size: 0.95rem;
  color: var(--navy);
  text-decoration: none;
  line-height: 1.4;
  flex: 1 1 12rem;
  min-width: 0;
}
.news-card a.title:hover { color: var(--sky); text-decoration: underline; }
.badge-focus {
  display: inline-flex;
  align-items: center;
  flex: 0 0 auto;
  padding: 0.12rem 0.5rem;
  border-radius: 999px;
  background: #DFF0FA;
  border: 1px solid var(--mist);
  color: var(--navy);
  font-size: 0.7rem;
  font-weight: 750;
  letter-spacing: 0.02em;
  line-height: 1.3;
}
.news-meta {
  margin-top: 0.3rem;
  font-size: 0.72rem;
  font-weight: 650;
  color: var(--sky);
}
.section-divider {
  height: 1px;
  background: var(--mist);
  margin: 1.35rem 0 0.25rem;
  border: 0;
}
.news-list.is-collapsed .news-card.news-extra { display: none; }
.news-toggle-wrap {
  display: flex;
  justify-content: center;
  margin-top: 0.85rem;
}
.news-toggle {
  appearance: none;
  cursor: pointer;
  font-family: inherit;
  font-size: 0.8125rem;
  font-weight: 700;
  color: var(--navy);
  background: var(--snow);
  border: 1px solid var(--mist);
  border-radius: 999px;
  padding: 0.45rem 1.1rem;
  line-height: 1.3;
}
.news-toggle:hover {
  background: var(--ice);
  border-color: var(--aqua);
  color: var(--sky);
}
.news-toggle:focus-visible {
  outline: 2px solid var(--sky);
  outline-offset: 3px;
}
.news-related {
  margin-top: 0.45rem;
  font-size: 0.75rem;
  color: var(--mute);
  line-height: 1.45;
}
.news-related summary {
  cursor: pointer;
  font-weight: 700;
  color: var(--sky);
  list-style: none;
}
.news-related summary::-webkit-details-marker { display: none; }
.news-related summary::before {
  content: "▸ ";
  color: var(--aqua);
}
.news-related[open] summary::before { content: "▾ "; }
.news-related ul {
  list-style: none;
  margin: 0.35rem 0 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
}
.news-related a {
  color: var(--navy);
  font-weight: 650;
  text-decoration: none;
}
.news-related a:hover { color: var(--sky); text-decoration: underline; }
.news-related .src {
  color: var(--mute);
  font-weight: 600;
  margin-right: 0.35rem;
}

.month { margin-top: 1.5rem; }
.month h2 {
  font-family: "Source Serif 4", "Noto Serif SC", Georgia, serif;
  font-size: 1.15rem;
  color: var(--navy);
  margin-bottom: 0.65rem;
}
.days {
  list-style: none;
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
}
.days a {
  display: inline-block;
  padding: 0.4rem 0.75rem;
  background: var(--ice);
  border: 1px solid var(--mist);
  border-radius: 999px;
  text-decoration: none;
  font-weight: 650;
  font-size: 0.875rem;
}
.days a:hover { background: #D9ECF8; border-color: var(--aqua); }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <div class="hero-top">
        <div>
          <div class="badge-date"><span class="dot" aria-hidden="true"></span>往期速览</div>
          <h1>按月浏览</h1>
        </div>
        <nav class="nav" aria-label="站点导航">
          <a href="index.html" target="_blank" rel="noopener noreferrer">最新速览</a>
          <a href="https://github.com/trending?since=weekly" target="_blank" rel="noopener noreferrer">GitHub Trending</a>
        </nav>
      </div>
    </header>
      <section class="month">
        <h2>2026-10</h2>
        <ul class="days">
          <li><a href="archive/2026-10/github-trending-weekly-2026-10-11.html" target="_blank" rel="noopener noreferrer">2026-10-11</a></li>
          <li><a href="archive/2026-10/github-trending-weekly-2026-10-10.html" target="_blank" rel="noopener noreferrer">2026-10-10</a></li>
          <li><a href="archive/2026-10/github-trending-weekly-2026-10-09.html" target="_blank" rel="noopener noreferrer">2026-10-09</a></li>
        </ul>
      </section>
    <footer class="foot">
      <p>每天覆盖同一份日快照；按月分文件夹归档。</p>
    </footer>
  </div>
</body>
</html>
